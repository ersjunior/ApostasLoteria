[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apostas-loteria"
version = "0.1.0"
description = "Análise estatística, verificação de jogos e forecast para loterias brasileiras"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "streamlit==1.53.0",
    "pandas==2.3.3",
    "numpy==2.4.1",
    "plotly==6.5.2",
    "reportlab==4.4.9",
    "openpyxl==3.1.5",
    "requests==2.32.5",
    "kaleido==1.2.0",
]

[project.optional-dependencies]
api = [
    "fastapi==0.128.0",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.12.5",
    "scikit-learn==1.8.0",
]
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
    "mypy==2.3.0",
    "pre-commit==4.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "api*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "api", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["app", "api"]

[tool.ruff.lint.per-file-ignores]
"app/Home.py" = ["E402"]
"app/pages/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

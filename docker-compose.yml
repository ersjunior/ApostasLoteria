# Loterias Analyzer — Streamlit + API FastAPI
# Uso: docker compose up --build
#
# Persistência: volume `apostas-data` montado em /app/app/data em ambos os serviços.
# Banco SQLite compartilhado (`loterias.db`) — elimina condição de corrida entre API e Streamlit.
#
# Integração: o Streamlit consome loterias_core localmente (não chama a API por HTTP).
# Os serviços são independentes e compartilham apenas o volume de dados.
# Não há depends_on entre eles; API_BASE_URL não se aplica nesta arquitetura.

services:
  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - LOTTERIAS_DB_PATH=/app/app/data/loterias.db
    volumes:
      - apostas-data:/app/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - LOTTERIAS_DB_PATH=/app/app/data/loterias.db
    volumes:
      - apostas-data:/app/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  apostas-data:
